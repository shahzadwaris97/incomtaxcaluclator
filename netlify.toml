[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/income-tax-calculator"
  to = "/income-tax-calculator/"
  status = 301
[[redirects]]
  from = "/currency-converter"
  to = "/currency-converter/"
  status = 301
[[redirects]]
  from = "/gold-rates"
  to = "/gold-rates/"
  status = 301
[[redirects]]
  from = "/salary-calculator"
  to = "/salary-calculator/"
  status = 301
[[redirects]]
  from = "/expense-planner"
  to = "/expense-planner/"
  status = 301
[[redirects]]
  from = "/financial-guides"
  to = "/financial-guides/"
  status = 301

# The generated route index.html documents serve direct visits and browser refreshes.
# Retain a catch-all SPA fallback for any other existing app URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
